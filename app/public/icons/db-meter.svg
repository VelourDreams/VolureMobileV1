<svg xmlns="http://www.w3.org/2000/svg" width="48" height="120" viewBox="0 0 48 120" role="img" aria-label="dB meter">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F6D07B"/>
      <stop offset="60%" stop-color="#F0C04A"/>
      <stop offset="100%" stop-color="#E6B13A"/>
    </linearGradient>
  </defs>
  <rect width="48" height="120" fill="none" />
  <!-- Scale marks and numbers -->
  <g fill="#9AA0A6" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="end">
    <text x="18" y="14">0</text>
    <line x1="20" y1="16" x2="30" y2="16" stroke="#9AA0A6" stroke-width="1" />

    <text x="18" y="34">3</text>
    <line x1="20" y1="36" x2="30" y2="36" stroke="#9AA0A6" stroke-width="1" />

    <text x="18" y="54">6</text>
    <line x1="20" y1="56" x2="30" y2="56" stroke="#9AA0A6" stroke-width="1" />

    <text x="18" y="74">9</text>
    <line x1="20" y1="76" x2="30" y2="76" stroke="#9AA0A6" stroke-width="1" />

    <text x="18" y="94">12</text>
    <line x1="20" y1="96" x2="30" y2="96" stroke="#9AA0A6" stroke-width="1" />
  </g>

  <!-- Bars container -->
  <g transform="translate(30,12)">
    <!-- Right bar (taller) -->
    <rect x="0" y="14" width="12" height="92" rx="2" fill="#E9B85A" opacity="0.12" />
    <rect x="0" y="38" width="12" height="68" rx="2" fill="url(#g)" />

    <!-- Left bar (shorter) -->
    <rect x="-16" y="24" width="12" height="82" rx="2" fill="#E9B85A" opacity="0.12" />
    <rect x="-16" y="50" width="12" height="56" rx="2" fill="url(#g)" />

    <!-- thin separators and top caps -->
    <rect x="0" y="36" width="12" height="2" rx="1" fill="#FFFFFF" opacity="0.06" />
    <rect x="-16" y="48" width="12" height="2" rx="1" fill="#FFFFFF" opacity="0.06" />
  </g>
</svg>
